# Rhinestone's own deployment of this proxy. Nothing here is needed to run the
# proxy yourself — see the README. It is skipped outside the upstream repo, so a
# fork gets green CI (ci.yaml) rather than a red deploy it has no credentials for.
#
# This repository is public, which makes its Actions logs public too. Registry and
# role therefore come from secrets so their values are masked in log output, and
# mask-aws-account-id keeps the bare account ID out of the AWS steps. This also
# means the account ID must never be hardcoded literally in this file (unlike every
# other RHI-5507 migration, which are all private repos) — the shared
# aws-codebuild-release.yaml workflow (infra-workflows#9) masks its own account-ID
# use for the same reason, since that job's logs run under this repo's Actions tab.
#
# RHI-5507: native per-arch builds on AWS CodeBuild instead of a GH-hosted
# single-arch `docker build` (this repo never had a buildx/QEMU step — this is
# also its first arm64 image). terraform-aws/modules/codebuild-image-builder,
# environments/shared/codebuild-deposit-widget-proxy.tf in rhinestonewtf/infra.
name: Push docker images to ECR and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build context and upload to S3
    if: github.repository == 'rhinestonewtf/deposit-widget-proxy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      short_sha: ${{ steps.set-tags.outputs.short_sha }}
      tags: ${{ steps.set-tags.outputs.tags }}
      skip_push: ${{ steps.check-exists.outputs.skip_push }}
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      APP_NAME: deposit-widget-proxy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Set Docker tags
        id: set-tags
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=latest $SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Check whether this image already exists in ECR
        id: check-exists
        run: |
          if aws ecr describe-images --repository-name "$APP_NAME" --image-ids imageTag=${{ steps.set-tags.outputs.short_sha }} &>/dev/null; then
            echo "Image $APP_NAME:${{ steps.set-tags.outputs.short_sha }} already exists in ECR, skipping build"
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          fi

      # Derives the zip's exclude list from .dockerignore instead of hardcoding paths
      # (Kevin, caught on the relayer migration, RHI-5507) — a hardcoded list would
      # ship everything else .dockerignore keeps out of the image. This repo had no
      # .dockerignore before this migration — added alongside it.
      - name: Zip build context
        if: steps.check-exists.outputs.skip_push == 'false'
        run: |
          set -euo pipefail
          # `.dockerignore` and this zip are NOT the same thing (RHI-5507, deposit-service-processor
          # #663): `.dockerignore` describes the context streamed to the docker daemon, where the
          # Dockerfile is redundant — docker reads it separately — so listing it there is normal.
          # The zip is the WORKING DIRECTORY CodeBuild unpacks and runs `docker build .` inside, so
          # the Dockerfile has to survive, and `.dockerignore` itself has to survive for the daemon
          # to keep applying it. Deriving one from the other without this carve-out is what broke
          # deposit-service-processor's build with `open Dockerfile: no such file or directory`.
          BUILD_ESSENTIAL=('Dockerfile' '.dockerignore')
          EXCLUDES=('.git/*')
          if [[ -f .dockerignore ]]; then
            while IFS= read -r pattern; do
              pattern="${pattern%$'\r'}"
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              pattern="${pattern#./}"
              pattern="${pattern#/}"
              keep=false
              for essential in "${BUILD_ESSENTIAL[@]}"; do
                # Glob match, not exact-string: a pattern like `Dockerfile*` would
                # exclude Dockerfile too, but wouldn't equal the literal string
                # "Dockerfile" (Kevin, RHI-5507, caught on user-service).
                [[ "$essential" == $pattern ]] && keep=true && break
              done
              [[ "$keep" == true ]] && continue
              EXCLUDES+=("$pattern")
              [[ "$pattern" != *'*'* ]] && EXCLUDES+=("$pattern/*")
            done < .dockerignore
          fi
          ARGS=()
          for e in "${EXCLUDES[@]}"; do ARGS+=(-x "$e"); done
          zip -qr /tmp/build-context.zip . "${ARGS[@]}"

          # The failure this replaces was silent until CodeBuild ran, minutes and one S3
          # upload later. Assert here instead.
          for essential in "${BUILD_ESSENTIAL[@]}"; do
            if [[ -f "$essential" ]] && ! unzip -l /tmp/build-context.zip "$essential" >/dev/null 2>&1; then
              echo "::error::$essential is missing from the build context zip; CodeBuild cannot build without it"
              exit 1
            fi
          done

      - name: Upload build context to S3
        if: steps.check-exists.outputs.skip_push == 'false'
        # SOURCE_BUCKET is derived from the (masked) ECR_REGISTRY secret rather than
        # hardcoded, since this repo is public — see the mask-aws-account-id note above.
        run: |
          SOURCE_BUCKET="$APP_NAME-codebuild-source-${ECR_REGISTRY%%.*}"
          aws s3 cp /tmp/build-context.zip "s3://$SOURCE_BUCKET/deposit-widget-proxy/${{ steps.set-tags.outputs.short_sha }}.zip"

  codebuild:
    name: Build, push and scan via CodeBuild
    needs: prepare
    if: github.repository == 'rhinestonewtf/deposit-widget-proxy'
    permissions:
      id-token: write
    uses: rhinestonewtf/infra-workflows/.github/workflows/aws-codebuild-release.yaml@main
    with:
      app_name: deposit-widget-proxy
      short_sha: ${{ needs.prepare.outputs.short_sha }}
      tags: ${{ needs.prepare.outputs.tags }}
      skip_push: ${{ needs.prepare.outputs.skip_push == 'true' }}
      # This repo never had a scan step before — soft-fail so this migration adds
      # visibility without introducing a new deploy-blocking gate as a side effect.
      fail_on_critical: false

  cd-pipeline:
    needs: [prepare, codebuild]
    if: github.repository == 'rhinestonewtf/deposit-widget-proxy'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: rhinestonewtf
          repositories: infra
      - name: Dispatch and watch cd-pipeline
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          DISPATCH_TS=$(date -u +%s)

          # One image, two ArgoCD Applications running it with different values:
          # `deposit-proxy` is Rhinestone's own instance (dev + staging + prod) and
          # `deposit-widget-proxy` is a client's tenant on their own API key, prod only.
          # Dispatch OURS — the pipeline chain starts at dev, so naming the prod-only
          # tenant here failed at the first stage ("no values-dev.yaml") and never
          # reached staging, prod or the approval gate. infra's cd-pipeline fans
          # `deposit-proxy` out to both tenants at the prod stage, so this one dispatch
          # still ships the client the identical image under the same approval.
          gh workflow run aws-cd-pipeline.yaml \
            --repo rhinestonewtf/infra \
            --ref main \
            --field app_name=deposit-proxy \
            --field version_sha=${{ needs.prepare.outputs.short_sha }}

          echo "Waiting for run to be created..."
          sleep 8

          RUN_ID=$(gh run list \
            --repo rhinestonewtf/infra \
            --workflow aws-cd-pipeline.yaml \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,createdAt \
            --jq "[.[] | select((.createdAt | fromdateiso8601) >= $DISPATCH_TS)] | .[0].databaseId")

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Failed to find the dispatched workflow run" >&2
            exit 1
          fi

          echo "Deployment action has been triggered: https://github.com/rhinestonewtf/infra/actions/runs/$RUN_ID"
