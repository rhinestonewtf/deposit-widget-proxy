version: 0.2
# Runs on the amd64 CodeBuild project (terraform-aws/modules/codebuild-image-builder,
# environments/shared/codebuild-deposit-widget-proxy.tf in rhinestonewtf/infra). Builds
# and pushes the image natively, no QEMU.

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      # Retries: a first pull of an uncached tag still reaches Docker Hub through the pull-through cache.
      - |
        for i in 1 2 3; do
          docker build --build-arg DOCKER_HUB="$ECR_REGISTRY/docker-hub" -t "$ECR_REGISTRY/$APP_NAME:$IMAGE_TAG-amd64" . && break
          [ "$i" -eq 3 ] && { echo "docker build failed after 3 attempts" >&2; exit 1; }
          echo "docker build failed (attempt $i/3), retrying in 10s..." >&2
          sleep 10
        done
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$APP_NAME:$IMAGE_TAG-amd64"
